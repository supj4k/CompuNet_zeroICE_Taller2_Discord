plugins {
    id 'application'
}

dependencies {
    implementation project(':common')

    // Pruebas de integración RF-01/RF-02 (./gradlew :server:test)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

application {
    mainClass = 'chat.server.ServerMain'
}

// ./gradlew runServer
tasks.register('runServer', JavaExec) {
    group = 'chat'
    description = 'Arranca el servidor Ice usando config.server'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    workingDir = projectDir                 // para que encuentre config.server
    args '--Ice.Config=config.server'
    standardInput = System.in
}