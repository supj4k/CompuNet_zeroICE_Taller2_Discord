plugins {
    id 'application'
}

dependencies {
    implementation project(':common')
}

application {
    mainClass = 'chat.client.ClientMain'
}

// ./gradlew runClient                        -> localhost
// ./gradlew runClient -Pserver=192.168.1.20  -> server en otra máquina
tasks.register('runClient', JavaExec) {
    group = 'chat'
    description = 'Arranca un cliente CLI usando config.client'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = application.mainClass
    workingDir = projectDir
    standardInput = System.in

    def host = project.findProperty('server') ?: 'localhost'
    def port = project.findProperty('port') ?: '10000'
    args '--Ice.Config=config.client', "--ChatServer.Proxy=ChatServer:tcp -h ${host} -p ${port}"
}
// ./gradlew runAudioTest -PaudioArgs="127.0.0.1 5000 5000"
tasks.register('runAudioTest', JavaExec) {
    group = 'chat'
    description = 'Prueba aislada de audio UDP (RF-05)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'chat.client.audio.AudioTest'
    standardInput = System.in
    args((project.findProperty('audioArgs') ?: '127.0.0.1 5000 5000').split(' '))
}